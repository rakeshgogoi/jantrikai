services:
  # ── Jantrik AI marketing site (Next.js static export) ───────────────────────
  - type: web
    name: jantrikai
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Next.js generates icon and opengraph-image as extension-less PNGs;
      # force the correct Content-Type so browsers and social crawlers render them.
      - path: /icon
        name: Content-Type
        value: image/png
      - path: /opengraph-image
        name: Content-Type
        value: image/png
